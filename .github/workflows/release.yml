name: Release

# Releases whenever the add-on version in go_domestia/config.yaml changes on
# main: pushes an image per architecture, then tags and publishes a GitHub
# release with the matching CHANGELOG section. Home Assistant reads config.yaml
# from main, so it can offer the update a few minutes before the images are
# available.

on:
  push:
    branches: [main]
    paths: [go_domestia/config.yaml]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that can stop a release runs here, before any image is pushed
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' go_domestia/config.yaml)
          if [ -z "$version" ]; then
            echo "::error::No version found in go_domestia/config.yaml"
            exit 1
          fi

          sample=$(sed -n 's/^version: "\(.*\)"$/\1/p' go_domestia/config.sample.yaml)
          if [ "$sample" != "$version" ]; then
            echo "::error::config.sample.yaml has version $sample, config.yaml has $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
            echo "Release $version already exists, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release notes
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/release-notes.sh "$VERSION"

      - uses: actions/setup-go@v7
        if: steps.version.outputs.exists == 'false'
        with:
          go-version-file: go.mod

      - if: steps.version.outputs.exists == 'false'
        run: go vet ./...

      - if: steps.version.outputs.exists == 'false'
        run: go test ./...

  # Home Assistant pulls ghcr.io/<owner>/go-domestia-{arch}, one image per
  # architecture listed in go_domestia/config.yaml
  build:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
          - arch: amd64
            platform: linux/amd64
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/go-domestia-${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          push: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/release-notes.sh "$VERSION" > notes.md
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            --latest
