name: Release

# Releases whenever the add-on version in go_domestia/config.yaml changes on
# main: pushes an image per architecture, then tags and publishes a GitHub
# release with the matching CHANGELOG section. Home Assistant reads config.yaml
# from main, so it can offer the update a few minutes before the images are
# available.

on:
  push:
    branches: [main]
    paths: [go_domestia/config.yaml]
  workflow_dispatch:

# Jobs request what they need; the default is read-only
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Everything that can stop a release runs here, before any image is pushed
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' go_domestia/config.yaml)
          if [ -z "$version" ]; then
            echo "::error::No version found in go_domestia/config.yaml"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$version" > /dev/null; then
            echo "Release $version already exists, nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release notes
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/release-notes.sh "$VERSION"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.version.outputs.exists == 'false'
        with:
          go-version-file: go.mod

      - if: steps.version.outputs.exists == 'false'
        run: go vet ./...

      - if: steps.version.outputs.exists == 'false'
        run: go test ./...

      - if: steps.version.outputs.exists == 'false'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # Home Assistant pulls ghcr.io/<owner>/go-domestia-{arch}, one image per
  # architecture listed in go_domestia/config.yaml
  build:
    needs: prepare
    if: needs.prepare.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
          - arch: amd64
            platform: linux/amd64
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/go-domestia-${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # GITHUB_TOKEN is denied write access to packages that were first pushed
      # outside this workflow, so a GHCR_TOKEN secret (a classic personal access
      # token with write:packages) is used when present.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          push: true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/release-notes.sh "$VERSION" > notes.md
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            --latest
